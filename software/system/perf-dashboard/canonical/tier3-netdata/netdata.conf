# Managed by: software/system/perf-dashboard/canonical/tier3-netdata/netdata.conf
# Single-machine, localhost-only, fixed 60s polling.
# Source of truth — do not hand-edit /etc/netdata/netdata.conf; edit this and re-run install.sh.

[global]
    run as user = netdata
    update every = 60

[db]
    mode = dbengine
    dbengine multihost disk space MB = 200

[web]
    bind to = 127.0.0.1
    allow connections from = localhost
    allow dashboard from = localhost
    allow badges from = *
    allow streaming from = none
    allow netdata.conf from = localhost
    allow management from = localhost

[registry]
    enabled = no

[plugins]
    cgroups = no
    tc = no
    apps = yes
    proc = yes
    diskspace = yes
    python.d = yes
    go.d = yes

[plugin:apps]
    update every = 60

[plugin:proc:/proc/sys/kernel/random/entropy_avail]
    enabled = no
